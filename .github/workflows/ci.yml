name: CI — Build, Lint & Test

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y rpm libfuse2t64 || sudo apt-get install -y rpm libfuse2)

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Performance Benchmarks
        run: npm run test:perf

      - name: Build Production Bundle
        run: npm run build

      - name: Package Native Desktop Installers (Linux)
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:linux

      - name: Package Native Desktop Installers (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Package Native Desktop Installers (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Upload Build & Installer Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: preeffects-ci-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/
            dist-electron/
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.rpm
          retention-days: 7
