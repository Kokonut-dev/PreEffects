name: Release — Cross-Platform Desktop Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (e.g. v1.0.0) to publish/update a GitHub Release; leave blank for dry-run artifacts only"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package-macos:
    name: Package macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - name: Package macOS Universal Targets
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: PreEffects-macOS
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  package-windows:
    name: Package Windows (.exe, .msi & .zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - name: Package Windows NSIS, MSI & ZIP Installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: PreEffects-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/*.zip

  package-linux:
    name: Package Linux (.AppImage, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging tools
        run: sudo apt-get update && (sudo apt-get install -y rpm libfuse2t64 || sudo apt-get install -y rpm libfuse2)
      - run: npm ci || npm install
      - run: npm test
      - name: Package Linux Targets
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: PreEffects-Linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          mapfile -t FILES < <(find release-artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No installer artifacts found in release-artifacts/" >&2
            exit 1
          fi
          echo "Publishing ${#FILES[@]} desktop artifacts to release ${TAG}:"
          printf ' - %s\n' "${FILES[@]}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --title "PreEffects ${TAG}" \
              --generate-notes
          fi
